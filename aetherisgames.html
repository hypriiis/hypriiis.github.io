<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheris Game Data → Text (CORS Fixed)</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #e0e0e0; }
        .method { margin: 20px 0; padding: 15px; background: #222; border-radius: 8px; border-left: 4px solid #007acc; }
        button { padding: 10px 20px; background: #007acc; color: white; border: none; cursor: pointer; margin: 5px; }
        button:hover { background: #005a99; }
        button.success { background: #28a745; }
        button.success:hover { background: #218838; }
        pre { background: #111; padding: 20px; border-radius: 8px; max-height: 500px; overflow: auto; border: 1px solid #444; font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin-top: 10px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: bold; }
        .loading { background: #ffaa00; color: black; }
        .success { background: #00aa44; }
        .error { background: #aa0000; }
    </style>
</head>
<body>
    <h1>🎮 Aetheris Game Data (CORS Fixed)</h1>
    
    <div class="method">
        <h3>📡 Method 1: CORS Proxy (Works instantly)</h3>
        <button onclick="fetchWithProxy()">🔄 Load via Proxy</button>
        <pre id="proxyOutput">Click to load via proxy...</pre>
    </div>
    
    <div class="method">
        <h3>⚙️ Method 2: Local Server Mode</h3>
        <p>Save as <code>aetheris.html</code>, drag to Chrome, or use VSCode Live Server</p>
        <button onclick="fetchDirect()">🔄 Try Direct (local server)</button>
        <pre id="directOutput">...</pre>
    </div>
    
    <div class="method">
        <h3>🔗 Method 3: AllOrigins Proxy</h3>
        <button onclick="fetchAllOrigins()">🔄 Load via AllOrigins</button>
        <pre id="allOriginsOutput">...</pre>
    </div>

    <script>
        const API_URL = 'https://aetheris.lol/api/game';
        
        async function fetchWithProxy() {
            const output = document.getElementById('proxyOutput');
            const status = output.parentElement.querySelector('pre') || output;
            status.textContent = 'Loading via proxy...';
            
            try {
                // Free CORS proxy
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(API_URL)}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`Proxy failed: ${response.status}`);
                
                const data = await response.json();
                const textData = jsonToText(data);
                output.textContent = textData;
            } catch (error) {
                output.textContent = `❌ Proxy error: ${error.message}`;
            }
        }
        
        async function fetchDirect() {
            const output = document.getElementById('directOutput');
            try {
                const response = await fetch(API_URL, { mode: 'cors' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                output.textContent = jsonToText(data);
            } catch (error) {
                output.textContent = `❌ Direct fetch blocked by CORS\n💡 Use Live Server or drag file to Chrome`;
            }
        }
        
        async function fetchAllOrigins() {
            const output = document.getElementById('allOriginsOutput');
            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(API_URL)}`;
                const response = await fetch(proxyUrl);
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);
                output.textContent = jsonToText(data);
            } catch (error) {
                output.textContent = `❌ AllOrigins error: ${error.message}`;
            }
        }
        
        function jsonToText(obj, indent = 0) {
            const spaces = '  '.repeat(indent);
            let text = '';
            
            if (obj === null || obj === undefined) return 'null';
            if (typeof obj === 'string') return `"${obj}"`;
            if (typeof obj === 'number') return obj.toString();
            if (typeof obj === 'boolean') return obj.toString();
            if (Array.isArray(obj)) {
                text += '[\n';
                obj.forEach((item, i) => {
                    text += `${spaces}  ${i}: ${jsonToText(item, indent + 1)}\n`;
                });
                text += `${spaces}]`;
                return text;
            }
            
            for (const [key, value] of Object.entries(obj)) {
                text += `${spaces}${key}: ${jsonToText(value, indent + 1)}\n`;
            }
            return text || 'Empty object';
        }
        
        // Auto-load proxy method (most reliable)
        window.onload = () => fetchWithProxy();
    </script>
</body>
</html>
